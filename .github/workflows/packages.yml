name: Distribution smoke tests
on:
  workflow_dispatch:
  pull_request:
    paths: ['pyproject.toml', 'packaging/**', 'python/**', 'CMakeLists.txt', 'src/**', '.github/workflows/packages.yml']
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install build twine
      - run: python -m build && python -m twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: cp tests/packaging/python_smoke.py /tmp/python_smoke.py && cd /tmp && niryukti devices && python python_smoke.py
      - run: python scripts/package_npm.py --output /tmp/npm-dist
      - run: mkdir /tmp/node-consumer && cd /tmp/node-consumer && npm install /tmp/npm-dist/*.tgz && node node_modules/niryukti/install.js && npx niryukti devices && node node_modules/niryukti/smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-distributions
          path: |
            dist/*
            /tmp/npm-dist/*.tgz
