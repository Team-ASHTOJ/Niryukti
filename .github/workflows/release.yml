name: Build and publish VANTAGE packages
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Registry to publish after tests (build only uploads artifacts)'
        type: choice
        options: [build, pypi, npm, both]
        default: build
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cibuildwheel>=3,<4' build twine
      - run: python -m cibuildwheel --output-dir dist
      - run: python -m build --sdist --outdir dist && python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-release
          path: dist/*
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 scripts/package_npm.py --output /tmp/npm-dist
      - run: mkdir /tmp/node-consumer && cd /tmp/node-consumer && npm install /tmp/npm-dist/*.tgz && node node_modules/niryukti/install.js && node node_modules/niryukti/smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: /tmp/npm-dist/*.tgz
  publish-python:
    if: inputs.target == 'pypi' || inputs.target == 'both'
    needs: [python, node]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-release
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
  publish-node:
    if: inputs.target == 'npm' || inputs.target == 'both'
    needs: [python, node]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: npm-dist
      - run: npm publish npm-dist/*.tgz --access public
