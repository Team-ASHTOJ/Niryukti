services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    entrypoint: ["python3", "dashboard/server.py", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "127.0.0.1:8080:8080"

  api:
    profiles: [api]
    build:
      context: .
      dockerfile: Dockerfile.cpu
    entrypoint: ["python3", "-m", "niryukti", "serve", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      NIRYUKTI_API_TOKEN: ${NIRYUKTI_API_TOKEN:-}
    ports:
      - "127.0.0.1:8090:8090"
